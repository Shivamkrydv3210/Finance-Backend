<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Chat (legacy)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f0f12; color: #e4e4e7; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 1rem 1.5rem; border-bottom: 1px solid #27272a; background: #18181b; }
    .header h1 { margin: 0; font-size: 1.25rem; }
    .header a { color: #60a5fa; font-size: 0.85rem; }
    .chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 85%; padding: 0.75rem 1rem; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #3b82f6; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #27272a; border: 1px solid #3f3f46; }
    .input-area { padding: 1rem; border-top: 1px solid #27272a; background: #18181b; }
    .input-row { display: flex; gap: 0.5rem; }
    .input-row input { flex: 1; padding: 0.75rem; border-radius: 10px; border: 1px solid #3f3f46; background: #27272a; color: #e4e4e7; }
    .btn { padding: 0.75rem 1.25rem; border: none; border-radius: 10px; background: #3b82f6; color: #fff; cursor: pointer; }
    .error { color: #f87171; font-size: 0.875rem; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Invoice Chat</h1>
    <p><a href="/">← Back to Finance Console</a></p>
  </header>
  <main class="chat" id="chat"></main>
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="input" placeholder="Message or image URL…" />
      <button type="button" class="btn" id="send">Send</button>
    </div>
    <div id="error" class="error"></div>
  </div>
  <script src="/js/api-config.js"></script>
  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    document.getElementById("send").onclick = async () => {
      const text = inputEl.value.trim();
      if (!text) return;
      const u = document.createElement("div");
      u.className = "msg user";
      u.textContent = text;
      chatEl.appendChild(u);
      inputEl.value = "";
      const a = document.createElement("div");
      a.className = "msg assistant";
      a.textContent = "…";
      chatEl.appendChild(a);
      try {
        const isNgrok = /ngrok/i.test(String(window.__INVOICE_API_BASE__ || ""));
        const res = await fetch(typeof window.__invoiceApiUrl === "function" ? window.__invoiceApiUrl("/api/chat") : "/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(isNgrok ? { "ngrok-skip-browser-warning": "1" } : {}),
          },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        a.textContent = data.reply || data.error || JSON.stringify(data);
      } catch (e) {
        a.textContent = e.message;
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    };
  </script>
</body>
</html>
