<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Console</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">Finance Console</div>
        <div class="sub">Invoices · Ledger · Bank · Close</div>
      </div>
      <nav id="sidebar-nav" aria-label="Main"></nav>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <h1 id="page-title">Overview</h1>
        <span class="topbar-meta" id="health-dot">Checking…</span>
      </header>
      <main class="content" id="main-content"></main>
    </div>
  </div>
  <script src="/js/api-config.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    fetch(typeof window.__invoiceApiUrl === "function" ? window.__invoiceApiUrl("/health") : "/health", {
      headers:
        /ngrok/i.test(String(window.__INVOICE_API_BASE__ || ""))
          ? { "ngrok-skip-browser-warning": "1" }
          : {},
    })
      .then((r) => r.json())
      .then((d) => {
        document.getElementById("health-dot").textContent =
          d.status === "ok" ? "API online" : "API issue";
      })
      .catch(() => {
        document.getElementById("health-dot").textContent = "API offline";
      });
  </script>
</body>
</html>
