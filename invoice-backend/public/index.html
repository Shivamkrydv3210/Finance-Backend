<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f12;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #27272a;
      background: #18181b;
    }
    .header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .header p { margin: 0.25rem 0 0; font-size: 0.875rem; color: #71717a; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #27272a;
      border: 1px solid #3f3f46;
    }
    .msg.assistant img { max-width: 100%; border-radius: 8px; margin-top: 0.5rem; }
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #27272a;
      background: #18181b;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    .input-row input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      background: #27272a;
      color: #e4e4e7;
      font-size: 1rem;
    }
    .input-row input[type="text"]::placeholder { color: #71717a; }
    .input-row input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #3f3f46; cursor: not-allowed; color: #71717a; }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
    }
    .btn-secondary:hover { background: #3f3f46; }
    .upload-hint {
      font-size: 0.8rem;
      color: #71717a;
    }
    .upload-hint label { cursor: pointer; text-decoration: underline; }
    .upload-hint input[type="file"] { display: none; }
    .error { color: #f87171; font-size: 0.875rem; margin-top: 0.25rem; }

    .loader-msg {
      align-self: flex-start;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 85%;
    }
    .loader-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #3f3f46;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-spinner.simple { width: 16px; height: 16px; border-width: 2px; }
    .loader-text { color: #a1a1aa; font-size: 0.9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="header">
    <h1>Invoice Chat</h1>
    <p>Chat with the agent, paste an image URL, or upload an invoice image to extract and save.</p>
  </header>

  <main class="chat" id="chat"></main>

  <div class="input-area">
    <div class="input-row">
      <input
        type="text"
        id="input"
        placeholder="Type a message, paste image URL, or upload below..."
        autocomplete="off"
      />
      <button type="button" class="btn btn-primary" id="send" disabled>Send</button>
    </div>
    <div class="upload-hint">
      <label for="file">Upload invoice image</label>
      <input type="file" id="file" accept="image/*" />
      <span id="file-name"></span>
    </div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const fileEl = document.getElementById('file');
    const fileNameEl = document.getElementById('file-name');
    const errorEl = document.getElementById('error');

    let pendingImageDataUrl = null;

    function showError(msg) {
      errorEl.textContent = msg || '';
    }

    function appendMessage(role, content, isImageUpload = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'user' && isImageUpload) {
        div.textContent = 'Uploaded invoice image';
      } else {
        div.textContent = content;
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function showLoader(isProcessing) {
      const wrap = document.createElement('div');
      wrap.className = 'loader-msg';
      wrap.setAttribute('data-loader', '1');
      const spinner = document.createElement('div');
      spinner.className = 'loader-spinner' + (isProcessing ? '' : ' simple');
      const text = document.createElement('span');
      text.className = 'loader-text';
      text.textContent = isProcessing
        ? 'Processing invoice... Extracting and analyzing.'
        : 'Thinking...';
      wrap.appendChild(spinner);
      wrap.appendChild(text);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeLoader() {
      const el = chatEl.querySelector('[data-loader="1"]');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      const imageDataUrl = pendingImageDataUrl;

      if (!text && !imageDataUrl) {
        showError('Enter a message or upload an image.');
        return;
      }

      sendBtn.disabled = true;
      showError('');
      appendMessage('user', text || 'Uploaded invoice image', !!imageDataUrl);
      inputEl.value = '';
      if (imageDataUrl) {
        pendingImageDataUrl = null;
        fileEl.value = '';
        fileNameEl.textContent = '';
      }

      const isProcessing = !!imageDataUrl || /upload|extract|save|invoice\s*(image|photo|pic|file)/i.test(text || '');
      showLoader(isProcessing);

      try {
        const body = { message: text || 'Extract this invoice' };
        if (imageDataUrl) body.image_data_url = imageDataUrl;

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json().catch(() => ({}));

        removeLoader();

        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        appendMessage('assistant', data.reply || 'No reply.');
      } catch (e) {
        removeLoader();
        showError(e.message || 'Request failed');
        appendMessage('assistant', 'Sorry, something went wrong: ' + e.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    fileEl.addEventListener('change', () => {
      const file = fileEl.files[0];
      if (!file) {
        pendingImageDataUrl = null;
        fileNameEl.textContent = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        pendingImageDataUrl = reader.result;
        fileNameEl.textContent = file.name;
      };
      reader.readAsDataURL(file);
    });

    sendBtn.disabled = false;
  </script>
</body>
</html>
